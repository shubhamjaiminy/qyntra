name: Qyntra QA

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  qa:
    name: Qyntra Quality Checks

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run Qyntra tests
        run: npm test

      - name: Run Qyntra analyzer
        if: always()
        run: npm run qa:analyze

      - name: Generate Qyntra dashboard
        if: always()
        run: npm run dashboard

      - name: Upload Qyntra dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qyntra-dashboard
          path: qyntra-dashboard/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
