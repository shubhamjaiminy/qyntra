name: Qyntra QA

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  qa:
    name: Qyntra Quality Checks

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Flakiness detection compares this run against previous ones, so
      # the history file has to outlive the workspace. Without this the
      # gate can still judge severity, but it can never tell a new
      # regression from a test that has been red for a month.
      #
      # The key is unique per run so the cache is always written, and
      # restore-keys pulls the most recent previous run's copy.
      - name: Restore Qyntra run history
        uses: actions/cache@v4
        with:
          path: qyntra-out/run-history.json
          key: qyntra-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            qyntra-history-${{ github.ref_name }}-
            qyntra-history-

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run Qyntra unit tests
        run: npm run test:unit

      - name: Run hand-written tests
        run: npm test

      # The product, run on itself: discover the app, generate and run
      # tests, analyse failures, and decide. Exits 1 when the release is
      # UNSAFE, which fails this check; the verdict and its reasons are
      # written to the job summary on the run page.
      #
      # Hosted runners have no Ollama, so AI is chosen per environment:
      # Gemini when the GEMINI_API_KEY secret exists, otherwise the
      # deterministic analyzer (the decision then reports lower
      # confidence rather than pretending AI was used).
      - name: Qyntra release decision
        if: ${{ !cancelled() }}
        run: npm run qyntra -- run
        env:
          QYNTRA_AI_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'none' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Qyntra dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qyntra-report
          path: qyntra-out/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
