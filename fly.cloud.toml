# Qyntra Cloud on Fly.io. One small machine and a volume hold everything.
#   fly launch --config fly.cloud.toml --no-deploy
#   fly volumes create qyntra_data --size 3
#   fly secrets set QYNTRA_CLOUD_SECRET=$(openssl rand -base64 48) QYNTRA_CLOUD_URL=https://<your-domain>
#   fly deploy --config fly.cloud.toml
app = "qyntra-cloud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.cloud"

[env]
  PORT = "8080"
  QYNTRA_CLOUD_DB = "/data/qyntra-cloud.db"

[[mounts]]
  source = "qyntra_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
